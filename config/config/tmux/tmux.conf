# ==============================================================================
# 基本設定
# ==============================================================================

# シェル (fish の config.fish で TMUX_SHELL を export している)
set -g default-shell "${TMUX_SHELL}"

# ESC の待ち時間を短くする (Neovim 用)
set -s escape-time 1

# ウィンドウ・ペインの番号を 1 から始め、閉じたら詰める
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on

set -g mouse on

# スクロールバックを増やす (Claude Code など出力が長いツール向け)
set -g history-limit 50000

# 端末のタイトルにペインのタイトルを表示
set -g set-titles on
set -g set-titles-string '#T'

# ==============================================================================
# 端末機能
# ==============================================================================

set -g default-terminal "tmux-256color"
# True color
set -as terminal-features ",*:RGB"
# Undercurl などの下線スタイル
set -as terminal-features ",*:usstyle"

# ==============================================================================
# Claude Code 向け
# ==============================================================================

# Shift+Enter などの修飾キー付き入力をアプリに渡す (Claude Code の改行入力)
set -s extended-keys on
set -s extended-keys-format csi-u
set -as terminal-features ",*:extkeys"

# 通知 (OSC 9/777) などのエスケープシーケンスを外側の端末へ通す
set -g allow-passthrough on

# フォーカスの出入りをアプリに伝える
set -g focus-events on

# OSC 52 でシステムのクリップボードにコピーできるようにする
set -s set-clipboard on

# ==============================================================================
# キーバインド
# ==============================================================================

set -g prefix C-x
unbind-key C-b
bind-key C-x send-prefix

# 分割 (現在のディレクトリを引き継ぐ)
bind-key v split-window -h -c "#{pane_current_path}"
bind-key - split-window -v -c "#{pane_current_path}"

# ペイン移動 (Vim 風)
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# 設定の再読み込み
bind-key r source-file ~/.config/tmux/tmux.conf \; display-message "Reloaded tmux.conf"

# ==============================================================================
# 見た目 (Catppuccin Latte)
# ==============================================================================

set -g mode-style "fg=#dce0e8,bg=#4c4f69"
set -g message-style "fg=#dce0e8,bg=#4c4f69"
set -g message-command-style "fg=#dce0e8,bg=#4c4f69"
set -g pane-border-style "fg=#4c4f69"
set -g pane-active-border-style "fg=#1e66f5"

# ステータスバー: 背景なし・文字色のみ
#   左: セッション名 (プレフィックス入力中はオレンジ)
#   中央: ウィンドウ一覧 (現在のウィンドウは青・太字)
#   右: ホスト名
set -g status on
set -g status-position bottom
set -g status-justify centre
set -g status-style "fg=#9ca0b0,bg=default"
set -g status-left-length 50
set -g status-right-length 50
set -g status-left "#{?client_prefix,#[fg=#fe640b],#[fg=#1e66f5]}#[bold][ #S ]"
set -g status-right "[ #H ]"

setw -g window-status-separator "  "
setw -g window-status-style "fg=#9ca0b0"
setw -g window-status-current-style "fg=#1e66f5,bold"
setw -g window-status-activity-style "fg=#4c4f69,underscore"
setw -g window-status-format "#I #W"
setw -g window-status-current-format "#I #W"
