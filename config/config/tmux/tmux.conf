# ==============================================================================
# 基本設定
# ==============================================================================

# シェル (fish の config.fish で TMUX_SHELL を export している)
set -g default-shell "${TMUX_SHELL}"

# ESC の待ち時間を短くする (Neovim 用)
set -s escape-time 1

# ウィンドウ・ペインの番号を 1 から始め、閉じたら詰める
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on

set -g mouse on

# スクロールバックを増やす (Claude Code など出力が長いツール向け)
set -g history-limit 50000

# 端末のタイトルにペインのタイトルを表示
set -g set-titles on
set -g set-titles-string '#T'

# ==============================================================================
# 端末機能
# ==============================================================================

set -g default-terminal "tmux-256color"
# True color
set -as terminal-features ",*:RGB"
# Undercurl などの下線スタイル
set -as terminal-features ",*:usstyle"

# ==============================================================================
# Claude Code 向け
# ==============================================================================

# Shift+Enter などの修飾キー付き入力をアプリに渡す (Claude Code の改行入力)
set -s extended-keys on
set -s extended-keys-format csi-u
set -as terminal-features ",*:extkeys"

# 通知 (OSC 9/777) などのエスケープシーケンスを外側の端末へ通す
set -g allow-passthrough on

# フォーカスの出入りをアプリに伝える
set -g focus-events on

# OSC 52 でシステムのクリップボードにコピーできるようにする
set -s set-clipboard on

# ==============================================================================
# キーバインド
# ==============================================================================

set -g prefix C-x
unbind-key C-b
bind-key C-x send-prefix

# 分割 (現在のディレクトリを引き継ぐ)
bind-key v split-window -h -c "#{pane_current_path}"
bind-key h split-window -v -c "#{pane_current_path}"

# 設定の再読み込み
bind-key r source-file ~/.config/tmux/tmux.conf \; display-message "Reloaded tmux.conf"

# ==============================================================================
# 見た目 (Catppuccin Latte)
# ==============================================================================

set -g mode-style "fg=#dce0e8,bg=#4c4f69"
set -g message-style "fg=#dce0e8,bg=#4c4f69"
set -g message-command-style "fg=#dce0e8,bg=#4c4f69"
set -g pane-border-style "fg=#4c4f69"
set -g pane-active-border-style "fg=#1e66f5"

set -g status on
set -g status-position bottom
set -g status-justify left
set -g status-style "fg=#4c4f69,bg=#dce0e8"
set -g status-left-length 100
set -g status-right-length 100
set -g status-left-style NONE
set -g status-right-style NONE
set -g status-left "#[fg=#dce0e8,bg=#1e66f5,bold] #H #[nobold,nounderscore,noitalics]"
set -g status-right "#[fg=#dce0e8,bg=#1e66f5,nobold,nounderscore,noitalics]#[bold] #S "

setw -g window-status-activity-style "underscore,fg=#ccd0da,bg=#dce0e8"
setw -g window-status-separator ""
setw -g window-status-style "NONE,fg=#ccd0da,bg=#dce0e8"
setw -g window-status-format "  #I  #W  "
setw -g window-status-current-format "#[fg=#4c4f69,bg=#dce0e8,nobold,nounderscore,noitalics]#[fg=#dce0e8,bg=#4c4f69,bold] #I  #W #[nobold,nounderscore,noitalics]"
